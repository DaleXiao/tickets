name = "tickets-worker"
main = "src/index.ts"
compatibility_date = "2024-12-18"

routes = [
  { pattern = "api-tickets.openclawd.co/*", zone_name = "openclawd.co" }
]

[vars]
ENVIRONMENT = "production"
# SPEC-345: LLM API Gateway。仅 URL，访问凭证走 LLM_SERVICE_TOKEN secret。
LLM_GATEWAY_URL = "https://api-llm.openclawd.co"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "4b68006a474145d3aabd36ea05d5265d"  # tickets-rate-limit, cindy 2026-08-16 创建回填

[durable_objects]
bindings = [
  { name = "GENERATION_QUEUE", class_name = "GenerationQueue" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GenerationQueue"]

# Secrets (set via `wrangler secret put`):
# - LLM_SERVICE_TOKEN   (SPEC-345; 值：SERVICE_TOKEN_TICKETS / cindy deploy 时写入)